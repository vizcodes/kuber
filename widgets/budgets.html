<!--
  Kuber Budgets & Goals Widget
  Rendered via show_widget. Replace const DATA = {} with computed JSON.

  DATA shape:
  {
    monthLabel: "September",
    totalSpent: 4126,
    totalBudget: 5200,
    daysLeft: 19,
    budgets: [
      { name: "Housing", spent: 1850, limit: 1900, color: "#AFA9EC", pct: 97, over: false },
      { name: "Food & Dining", spent: 742, limit: 700, color: "#F0997B", pct: 106, over: true },
      ...
    ],
    overBudgetWarning: "Food & dining is $42 over. Current pace projects $180 over by month end.",
    goals: [
      { name: "Emergency fund", icon: "shield", color: "#5DCAA5", current: 12400, target: 18000, pct: 69 },
      { name: "Japan trip", icon: "plane", color: "#AFA9EC", current: 2150, target: 5000, pct: 43 },
      ...
    ]
  }
-->
<style>
  .bg { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  .bg * { box-sizing: border-box; margin: 0; padding: 0; }
  .bg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .bg-title { font-size: 20px; font-weight: 500; color: var(--text-primary, #F5F4F1); }
  .bg-subtitle { font-size: 12px; color: var(--text-muted, #8C8C87); margin-top: 2px; }
  .bg-card {
    background: var(--surface-1, #141416); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border-strong, #242426);
  }
  .bg-budget-row { margin-bottom: 16px; }
  .bg-budget-row:last-child { margin-bottom: 0; }
  .bg-budget-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .bg-budget-name { font-size: 13px; color: var(--text-primary, #F5F4F1); }
  .bg-budget-amt { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-secondary, #8C8C87); }
  .bg-budget-amt .spent { color: var(--text-primary, #F5F4F1); }
  .bg-bar-track { height: 6px; border-radius: 3px; background: var(--surface-1, #1F1F22); overflow: hidden; }
  .bg-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .bg-warning {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-top: 12px;
    background: rgba(226,75,74,0.08); border-radius: 8px; border: 1px solid rgba(226,75,74,0.2);
    font-size: 12px; color: #E24B4A;
  }
  .bg-section-title { font-size: 16px; font-weight: 500; color: var(--text-primary, #F5F4F1); margin: 20px 0 12px; }
  .bg-goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .bg-goal {
    background: var(--surface-1, #141416); border-radius: 12px; padding: 14px;
    border: 1px solid var(--border-strong, #242426);
  }
  .bg-goal-name { font-size: 12px; color: var(--text-muted, #8C8C87); margin-bottom: 6px; }
  .bg-goal-amt { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-primary, #F5F4F1); }
  .bg-goal-target { font-size: 11px; color: var(--text-muted, #8C8C87); margin: 4px 0 8px; }
  .bg-goal-bar { height: 4px; border-radius: 2px; background: var(--surface-1, #1F1F22); overflow: hidden; }
  .bg-goal-fill { height: 100%; border-radius: 2px; }
</style>
<div class="bg">
  <div class="bg-header">
    <div>
      <div class="bg-title">Budgets</div>
      <div class="bg-subtitle" id="bg-sub"></div>
    </div>
  </div>
  <div class="bg-card" id="bg-budgets"></div>
  <div id="bg-warn"></div>
  <div class="bg-section-title">Goals</div>
  <div class="bg-goals-grid" id="bg-goals"></div>
</div>
<script>
const DATA = {};

function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 0});
}

document.getElementById('bg-sub').textContent =
  `${fmt(DATA.totalSpent || 0)} of ${fmt(DATA.totalBudget || 0)} spent · ${DATA.daysLeft || 0} days left in ${DATA.monthLabel || ''}`;

// Budgets
const bEl = document.getElementById('bg-budgets');
(DATA.budgets || []).forEach(b => {
  const fillPct = Math.min(b.pct, 100);
  const fillColor = b.over ? '#E24B4A' : b.color;
  bEl.innerHTML += `
    <div class="bg-budget-row">
      <div class="bg-budget-top">
        <div class="bg-budget-name">${b.name}</div>
        <div class="bg-budget-amt"><span class="spent">${fmt(b.spent)}</span> / ${fmt(b.limit)}</div>
      </div>
      <div class="bg-bar-track"><div class="bg-bar-fill" style="width:${fillPct}%;background:${fillColor}"></div></div>
    </div>
  `;
});

// Warning
if (DATA.overBudgetWarning) {
  document.getElementById('bg-warn').innerHTML =
    `<div class="bg-warning">⚠ ${DATA.overBudgetWarning}</div>`;
}

// Goals
const gEl = document.getElementById('bg-goals');
(DATA.goals || []).forEach(g => {
  const pct = Math.min(g.pct, 100);
  gEl.innerHTML += `
    <div class="bg-goal">
      <div class="bg-goal-name">${g.name}</div>
      <div class="bg-goal-amt">${fmt(g.current)}</div>
      <div class="bg-goal-target">of ${fmt(g.target)}</div>
      <div class="bg-goal-bar"><div class="bg-goal-fill" style="width:${pct}%;background:${g.color}"></div></div>
    </div>
  `;
});
</script>
